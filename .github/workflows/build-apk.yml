name: 🔨 Build Bio-Aether APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Descargar Gradle Wrapper real
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle-bin.zip
          unzip -q gradle-bin.zip
          cp gradle-8.4/bin/gradle .
          ./gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: 🏗️ Compilar APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📦 Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: BioAetherCore-v4.0-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
